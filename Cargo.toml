[package]
name = "patina"
version = "0.1.0"
edition = "2024"

[features]
default = []
mock = []

[dependencies]
anyhow = "1.0.102"
circular-buffer = "1.2.0"
clap = { version = "4.6.0", features = ["derive"] }
dirs = "6.0.0"
either = "1.15.0"
enum_dispatch = "0.3.13"
env_logger = "0.11.10"
log = "0.4.29"
poppingboba = "0.2.0"
ratatui = "0.30.0"
timeago = "0.6.0"
tiny-str = "0.10.1"
tui-overlay = "0.1.2"
tokio = { version = "1", features = ["rt-multi-thread", "time", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
uuid = "1"
